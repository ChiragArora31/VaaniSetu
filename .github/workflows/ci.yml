name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install media and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-mar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile tracked Python files
        run: git ls-files '*.py' -z | xargs -0 python -m py_compile

      - name: Check frontend syntax
        run: node --check frontend/app.js

      - name: Run test suite
        env:
          BAIF_ALLOW_MODEL_DOWNLOAD: "0"
          BAIF_ALLOW_PREVIEW_TRANSLATOR: "1"
        run: python -m unittest discover -s tests -v
